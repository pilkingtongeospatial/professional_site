title: Dusty Pilkington
tagline: Software Professional. Geographer. Curious Person
description: >-
  Software professional, geographer, and curious person. Portfolio of GIS
  projects, CV, and publications.
author: Dusty Pilkington
email: pilkingtongeospatial@gmail.com
url: "https://pilkingtongeospatial.github.io"
baseurl: "/professional_site"
theme: null

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: portfolio

plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
